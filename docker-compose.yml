services:
  gateway:
    build: .
    container_name: llm_gateway
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Healthcheck de READINESS: marca "healthy" só quando Redis e banco
    # respondem (/health/ready => 503 se degradado). O container sempre
    # escuta em 8000 (fixo no Dockerfile/CMD) — não usar ${GATEWAY_PORT}.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gateway-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm_gateway_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Só loopback: este Redis NÃO tem senha. Publicado em 0.0.0.0 ele ficava
      # alcançável por qualquer máquina da rede local (o host é um laptop, que
      # troca de WiFi) — vetor clássico de cryptominer/ransomware em Redis
      # aberto. 127.0.0.1 mantém o uso local (`redis-cli -p 6379`) intacto.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: llm_gateway_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
    ports:
      # 127.0.0.1 pelo mesmo motivo do Redis: Postgres com usuário/senha de dev
      # (gateway/gateway) não deve ficar exposto na LAN. Ferramentas locais
      # (psql, DBeaver) continuam funcionando em localhost:5433.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-llm_gateway}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  gateway-net:
    driver: bridge
